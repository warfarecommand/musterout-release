name: Sync public daily feed

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musterout-release-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and validate public feeds
        env:
          MO_FEED_PUBLIC_KEY: ${{ vars.MO_FEED_PUBLIC_KEY }}
          MO_FEED_KEY_ID: ${{ vars.MO_FEED_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed-download/v2"
          curl -q --fail --silent --show-error --max-time 60 --max-filesize 250000 --proto '=https' https://watch.warfarecommand.com/feed/latest.json -o "$RUNNER_TEMP/feed-download/latest.json"
          curl -q --fail --silent --show-error --max-time 60 --max-filesize 2000000 --proto '=https' https://watch.warfarecommand.com/feed/v2/latest.json -o "$RUNNER_TEMP/feed-download/v2/latest.json"
          curl -q --fail --silent --show-error --max-time 60 --max-filesize 2000000 --proto '=https' https://watch.warfarecommand.com/feed/v2/feed.js -o "$RUNNER_TEMP/feed-download/v2/feed.js"
          python3 feed/sync.py --downloads "$RUNNER_TEMP/feed-download"
      - name: Commit changed feeds
        shell: bash
        run: |
          set -euo pipefail
          git add feed/latest.json feed/v2/latest.json feed/v2/feed.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync public daily feed'
            git push
          fi
