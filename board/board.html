<title>Muster Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ee; --bg-2:#e9e8e3; --panel:#ffffff; --panel-2:#f7f6f2;
  --line:rgba(26,26,28,.12); --line-2:rgba(26,26,28,.22);
  --ink:#1a1a1c; --ink-2:#4a4a4f; --ink-3:#5f5f65;
  --red:#C8102E; --red-ink:#8f0b21; --red-tint:rgba(200,16,46,.09);
  --amber:#b84e00; --amber-ink:#9a4000; --amber-tint:rgba(184,78,0,.10);
  --green:#1a7d55; --green-ink:#166a49; --green-tint:rgba(26,125,85,.10);
  --blue-ink:#3b5c9a; --blue-tint:rgba(59,92,154,.10);
  --sb-band:rgba(184,78,0,.07); --grid:rgba(26,26,28,.08);
  --shadow:0 10px 30px rgba(26,26,28,.10);
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans','Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#101012; --panel:#151517; --panel-2:#1c1c1f;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
    --ink:rgba(255,255,255,.93); --ink-2:rgba(255,255,255,.66); --ink-3:rgba(255,255,255,.56);
    --red:#C8102E; --red-ink:#ff4d63; --red-tint:rgba(200,16,46,.16);
    --amber:#FF6B00; --amber-ink:#ff8f40; --amber-tint:rgba(255,107,0,.13);
    --green:#1f9d6b; --green-ink:#43d197; --green-tint:rgba(67,209,151,.12);
    --blue-ink:#9db0d3; --blue-tint:rgba(157,176,211,.13);
    --sb-band:rgba(255,107,0,.075); --grid:rgba(255,255,255,.06);
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#101012; --panel:#151517; --panel-2:#1c1c1f;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:rgba(255,255,255,.93); --ink-2:rgba(255,255,255,.66); --ink-3:rgba(255,255,255,.56);
  --red:#C8102E; --red-ink:#ff4d63; --red-tint:rgba(200,16,46,.16);
  --amber:#FF6B00; --amber-ink:#ff8f40; --amber-tint:rgba(255,107,0,.13);
  --green:#1f9d6b; --green-ink:#43d197; --green-tint:rgba(67,209,151,.12);
  --blue-ink:#9db0d3; --blue-tint:rgba(157,176,211,.13);
  --sb-band:rgba(255,107,0,.075); --grid:rgba(255,255,255,.06);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}


:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f5; --bg-2:#e9ebed; --panel:#ffffff; --panel-2:#f6f7f8;
  --line:rgba(12,14,18,.10); --line-2:rgba(12,14,18,.20);
  --ink:#131519; --ink-2:#474c55; --ink-3:#767c86;
  --red:#C8102E; --red-ink:#b00d27; --red-tint:rgba(200,16,46,.08);
  --amber:#d45a00; --amber-ink:#a84700; --amber-tint:rgba(212,90,0,.10);
  --green:#12805a; --green-ink:#0e7350; --green-tint:rgba(18,128,90,.10);
  --blue-ink:#44598a; --blue-tint:rgba(68,89,138,.10);
  --sb-band:rgba(212,90,0,.07); --grid:rgba(12,14,18,.07);
  --shadow:0 8px 24px rgba(15,20,30,.10);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#101012; --panel:#151517; --panel-2:#1c1c1f;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:rgba(255,255,255,.93); --ink-2:rgba(255,255,255,.66); --ink-3:rgba(255,255,255,.56);
  --red:#C8102E; --red-ink:#ff4d63; --red-tint:rgba(200,16,46,.16);
  --amber:#FF6B00; --amber-ink:#ff8f40; --amber-tint:rgba(255,107,0,.13);
  --green:#1f9d6b; --green-ink:#43d197; --green-tint:rgba(67,209,151,.12);
  --blue-ink:#9db0d3; --blue-tint:rgba(157,176,211,.13);
  --sb-band:rgba(255,107,0,.075); --grid:rgba(255,255,255,.06);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 72px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--ink)}
.mono{font-family:var(--mono)}
.label{font:500 12px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
h2{font:600 19px/1.25 var(--sans);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--sans);margin:0}
p{margin:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--red);padding-bottom:10px}
.top .eyebrow{font:600 12px/1 var(--mono);letter-spacing:.16em;color:var(--red-ink);text-transform:uppercase}
.top .who{font:600 17px/1.2 var(--sans);margin-top:6px}
.stamp{font:600 12px/1 var(--mono);letter-spacing:.08em;border:1.5px solid var(--red);color:var(--red-ink);padding:7px 9px;border-radius:3px;white-space:nowrap;text-align:right}
.stamp small{display:block;font:500 12px/1 var(--mono);color:var(--ink-3);letter-spacing:.1em;margin-bottom:4px}
.banner{margin-top:10px;font:500 12px/1.4 var(--mono);color:var(--ink-2);background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:4px}
.register-banner a{display:block;min-height:44px;padding:10px 12px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;overflow-wrap:break-word}
.register-banner{padding:0;border-left:2px solid var(--red)}
.banner[data-kind="warn"]{border-color:var(--amber);color:var(--amber-ink)}
#releaseBanner{overflow-wrap:anywhere}
.claude-message{margin-top:12px}
.claude-message p{overflow-wrap:anywhere;font-size:13.5px}
.claude-message .btn{margin-top:6px}
#talkToClaude{margin-top:14px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;padding:18px 0 16px}
.big{font:700 clamp(76px,22vw,128px)/.82 var(--cond);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigcap{font:500 12px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-bottom:6px}
.bigcap b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.stat{background:var(--panel);padding:10px 12px}
.stat .v{font:700 26px/1 var(--cond);font-variant-numeric:tabular-nums}
.stat .k{font:500 12px/1.25 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.stat.hot .v{color:var(--red-ink)}
.loes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:6px}
.loe-mini{display:grid;gap:5px;background:none;border:0;padding:0;text-align:left}
.loe-mini .n{font:700 13px/1 var(--mono);color:var(--red-ink)}
.loe-mini .nm{font:600 12.5px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-ink)}
.loe-mini .ct{font:500 12px/1 var(--mono);color:var(--ink-3)}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px 10px;font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}

/* sections */
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel + .panel{margin-top:14px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.stack{display:grid;gap:14px}

/* item rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{position:relative;width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:4px;background:none;display:grid;place-items:center;padding:0;margin-top:1px}
.chk::before{content:"";position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%)}
.chk[data-s="done"]{background:var(--green);border-color:var(--green)}
.chk[data-s="done"]::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk[data-s="waiting"]{border-style:dashed;border-color:var(--blue-ink)}
.chk[data-s="doing"]{border-color:var(--amber)}
.chk[data-s="doing"]::after{content:"";width:8px;height:8px;background:var(--amber);border-radius:1px}
.chk[data-s="na"]{opacity:.35}
.chk[disabled]{cursor:default}
.ttl{background:none;border:0;padding:0;text-align:left;display:grid;gap:4px;width:100%}
.ttl .t{font:500 14.5px/1.35 var(--sans);text-wrap:pretty}
.row.done .ttl .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 12px/1.2 var(--mono);color:var(--ink-3);letter-spacing:.04em}
.crit{display:inline-block;width:7px;height:7px;background:var(--red);transform:rotate(45deg);margin-right:3px;vertical-align:1px}
.tag{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.chip{font:600 12px/1 var(--mono);letter-spacing:.05em;padding:5px 7px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.late{border-color:var(--red);color:var(--red-ink);background:var(--red-tint)}
.chip.soon{border-color:var(--amber);color:var(--amber-ink);background:var(--amber-tint)}
.chip.ok{border-color:transparent;color:var(--green-ink);background:var(--green-tint)}
.chip.wait{border-color:transparent;color:var(--blue-ink);background:var(--blue-tint)}
.chip.win{border-style:dashed}
.chip.pend{white-space:normal;max-width:13em;line-height:1.25;text-align:right}
@media (max-width:560px){.chip.win .to{display:block;margin-top:3px;text-align:right}}
.date{display:grid;justify-items:end;gap:4px}
.date .e{font:500 12px/1 var(--mono);color:var(--ink-3)}

/* expanded card */
.card{grid-column:2 / -1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;margin-top:2px}
.card .why{color:var(--ink-2);font-size:14px}
.card ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{background:none;border:1px solid var(--line-2);border-radius:4px;padding:5px 7px;font:600 12px/1.1 var(--mono);color:var(--ink-2);letter-spacing:.03em;text-align:left}
.cite[aria-expanded="true"]{border-color:var(--red);color:var(--ink)}
.quote{border-left:2px solid var(--red);padding:6px 10px;font-size:13.5px;color:var(--ink-2);background:var(--bg-2);border-radius:0 4px 4px 0}
.quote a{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red-ink);text-decoration:none;display:inline-block;margin-top:6px}
.verify{font-size:13.5px;border:1px dashed var(--amber);border-radius:4px;padding:8px 10px;color:var(--ink)}
.verify b{font:600 12px/1 var(--mono);letter-spacing:.1em;color:var(--amber-ink);display:block;margin-bottom:4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type="date"],input[type="number"],input[type="text"],input[type="url"],textarea{background:var(--bg-2);border:1px solid var(--line-2);border-radius:4px;padding:7px 9px;font-size:14px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.45}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:8px 12px;font:600 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{background:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* LOE blocks */
.loe{padding-block:4px 18px;scroll-margin-top:56px}
.loe-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:end;border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:2px}
.loe-h .num{font:700 44px/.8 var(--cond);color:var(--red-ink)}
.loe-h .sub{font-size:13px;color:var(--ink-2)}
.loe-h .pc{text-align:right;min-width:74px}
.loe-h .pc b{font:700 22px/1 var(--cond);display:block}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;align-items:stretch}
.alert::before{content:"";border-radius:2px;background:var(--ink-3)}
.alert[data-k="red"]::before{background:var(--red)}
.alert[data-k="amber"]::before{background:var(--amber)}
.alert[data-k="green"]::before{background:var(--green-ink)}
.alert p{font-size:14px}
.alert .label{margin-bottom:2px}

/* critical path */
.path{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative;margin-top:6px}
.node{display:grid;gap:6px;justify-items:start;padding-right:6px;position:relative}
.node .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);position:relative;z-index:1}
.node[data-s="done"] .dot{background:var(--green-ink);border-color:var(--green-ink)}
.node[data-s="late"] .dot{border-color:var(--red)}
.node[data-s="waiting"] .dot{border-color:var(--blue-ink);border-style:dashed}
.node::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line-2)}
.node:last-child::before{display:none}
.node .nl{font:600 12.5px/1.25 var(--sans)}
.node .nd{font:500 12px/1.2 var(--mono);color:var(--ink-3)}

/* questions */
.qgroup + .qgroup{margin-top:10px}
.qgroup ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:14px}

/* what-if */
.range{width:100%;accent-color:var(--red)}
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;font-size:13.5px;margin-top:10px}
.wi .d{font:500 12px/1.4 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wi .d.chg{color:var(--amber-ink)}

/* timeline */
.tl{display:grid;grid-template-columns:96px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.tl-lanes{border-right:1px solid var(--line)}
.tl-lanes div{height:44px;display:flex;align-items:center;padding:0 10px;font:600 12px/1.15 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border-top:1px solid var(--line)}
.tl-lanes div:first-child{height:34px;border-top:0}
.tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tl svg{display:block}
.tl svg text{font-family:var(--mono);fill:var(--ink-3)}
.tl .mk{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font:500 12px/1 var(--mono);color:var(--ink-3)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;display:inline-block;border:1.5px solid var(--ink-2);border-radius:50%}
.sw.d{transform:rotate(45deg);border-radius:1px;background:var(--red);border-color:var(--red)}
.sw.g{background:var(--green-ink);border-color:var(--green-ink)}
.sw.b{border-style:dashed;border-color:var(--blue-ink)}
.sw.r{border-color:var(--red)}
.months{display:grid;gap:12px}
.month h3{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}

/* leave */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.kpi{background:var(--panel);padding:12px}
.kpi .v{font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.kpi .k{font:500 12px/1.25 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.kpi.bad .v{color:var(--red-ink)} .kpi.good .v{color:var(--green-ink)} .kpi.warn .v{color:var(--amber-ink)}
.chart svg{width:100%;height:auto;display:block}
.mtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mtab th,.mtab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab th{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mtab td.neg{color:var(--amber-ink)}
.lsw{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:-1px}
.chart text{font-family:var(--mono);fill:var(--ink-3)}
.blk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.blk:first-child{border-top:0}
.blk .ed{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.blk .ed label{display:grid;gap:4px}
.field{display:grid;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

/* VA */
.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start;counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s,decimal-leading-zero);font:700 15px/1.3 var(--mono);color:var(--red-ink)}
.steps li.done::before{color:var(--green-ink)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;gap:2px}
.rules b{font-weight:600}
.conds{display:grid}
.cond{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.cond:first-child{border-top:0}
.ask textarea{min-height:80px}
.ccs{display:grid}
.cc{border-top:1px solid var(--line);padding:9px 0}
.cc:first-child{border-top:0}
.cc-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.cc-d{display:grid;gap:10px;margin-top:8px;padding:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;font-size:14px;line-height:1.5}
.cc-d h4{font:600 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.cc-d ul{margin:0;padding-left:18px}
.cc-d li{margin:3px 0}
.cc-d p{margin:0}
.calc{display:grid;gap:6px}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:14px}
.ttab{width:100%;border-collapse:collapse}
.ttab th,.ttab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px;line-height:1.45}
.ttab th{font:600 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.vso{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.vso:first-child{border-top:0}
.answer{white-space:pre-wrap;font-size:14.5px;line-height:1.55;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:10px}

/* people */
.contact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact .nm{font-weight:600}
.contact .ln{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 12.5px/1.4 var(--mono);color:var(--ink-2);word-break:break-all}
.copy{background:none;border:1px solid var(--line-2);border-radius:4px;padding:3px 6px;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.refs{display:grid;gap:8px}
.refs a{font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-2)}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:4px;font:600 12px/1.2 var(--mono);letter-spacing:.05em;z-index:20;box-shadow:var(--shadow)}
.empty{font-size:14px;color:var(--ink-2);padding:6px 0}
footer{margin-top:28px;font:500 12px/1.5 var(--mono);color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}

@media (max-width:820px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .loes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path{grid-template-columns:minmax(0,1fr);gap:10px}
  .node{grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px}
  .node::before{display:none}
}
@media (max-width:420px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat .v{font-size:22px}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.donext .t{font-size:18px;line-height:1.3}
.amber{color:var(--amber-ink)}
#foot .btn{margin-left:6px;padding:5px 9px;font-size:12px}
#foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#setupForm .form{margin-top:8px}
#setupForm input[type="checkbox"]{width:auto;margin-right:6px}
