nts--both administrative and medical--are complete. Terminal leave runs continuously from the first day of leave until the date of EAS or transfer to the Retired List/FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and approving command: enter the agreed checkout target before terminal leave and confirm the elected processing option with its actual departure or return date.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"sep-eas","loe":"sep","order":13,"kind":"milestone","title":"EAS: confirmed service-end date","why":"Keep EAS separate from an earlier permanent departure or checkout. Confirm the approved service-end date and processing option with IPAC.","how":[],"owner":"You","due":{"eas":0},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2","quote":"Terminal leave is not granted until all separation requirements--both administrative and medical--are complete. Terminal leave runs continuously from the first day of leave until the date of EAS or transfer to the Retired List/FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"NAVMC 1700.2B","para":"Encl (2) para 9.a","quote":"Depart current PDS within 180 days of EAS on S-PTAD and return to PDS upon completion of SkillBridge to execute the separation process and receipt of DD-214.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"},{"ref":"NAVMC 1700.2B","para":"Encl (2) para 9.b","quote":"Depart PDS within 180 days of retirement or EAS on S-PTAD, and execute separation process prior to permanently departing and detaching from current PDS to include receipt of separation/retirement orders and DD Form 214 and not return to PDS before separation.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"}],"verify":"IPAC: confirm EAS, separation authority and the processing or departure date.","status":"open","doneOn":null,"notes":"","when":["notretire"],"basis":"target"},{"id":"ret-day","loe":"sep","order":14,"kind":"milestone","title":"Confirm the Retired List or FMCR effective date","why":"The manual sets ordinary retirement on the 1st day of the month, except disability and Reserve retirement with pay at age 60, and sets FMCR transfer on the last day of the month. IPAC and MMSR-2 must confirm your approved action and effective date. DFAS must confirm entitlement and the first payment. The last active-duty day is a separate date for BDD. For ordinary retirement it precedes the effective Retired List date by 1 day; IPAC and MMSR-2 must confirm exception and FMCR dates individually.","how":["The approved action and service-end dates are pending IPAC and MMSR-2 confirmation. Give Claude each date so the action is recorded here and the last active-duty day on the separate VA service-end milestone. Keep the retirement profile date on the approved action date."],"owner":"You","due":{"eas":0},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"Glossary para 252","quote":"All retirements, except those by reason of physical disability and Reservists who are retiring with pay at age 60, are effective on the 1st day of the month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"Retirement must be on the first day of the month. Effective date of transfer to the FMCR will be the last day of the month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.1.a","quote":"The first day of the month is the effective date of retirement and the last day of active duty is the preceeding day.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.1.b","quote":"Transfer to the FMCR is effected on the last day of the month and Marines assume a status in the FMCR on the first day of the following month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm Retired List versus FMCR and its effective date. DFAS retired pay: confirm entitlement and first payment.","status":"open","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"ret-fmcr-day","loe":"sep","order":15,"kind":"milestone","title":"FMCR transfer: last-day-of-month action","why":"If your approved action is FMCR transfer, the manual sets its effective date on the last day of the month. IPAC must enter the approved transfer date; the board cannot derive this action from the retirement profile alone.","how":["The date is pending confirmation by IPAC and MMSR-2. Give Claude the date the office confirms and ask Claude to record it on this item. Keep the item open until the action is complete.","Ask IPAC and MMSR-2 to distinguish the transfer action, FMCR status start and last active-duty day. Give Claude all confirmed dates to record on this item and the separate VA service-end milestone."],"owner":"You","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"Retirement must be on the first day of the month. Effective date of transfer to the FMCR will be the last day of the month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.1.b","quote":"Transfer to the FMCR is effected on the last day of the month and Marines assume a status in the FMCR on the first day of the following month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm whether this action applies, enter the approved last-day-of-month date and mark this item not applicable for a Retired List action.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"rule"},{"id":"sep-counsel","loe":"sep","order":16,"kind":"task","title":"Resignation counseling with the CO and the page 11 entry","why":"The CO counsels you and records your Reserve commission choice before submission. MARADMIN 175/24 prints a 6-to-18-month submission window, while the manual diary window is 4 to 14 months. The 7-month date is a planning target. Reserve appointment approval requires at least 4 months from HQMC receipt of that request, after resignation approval and EAS entry permit RA submission.","how":["Tell the CO the date you are resigning and whether you want a Reserve commission.","The CO counsels you under MCO 1900.16 para 5003. IPAC makes the page 11 entry in the exact wording of para 5003.1.","If you want a Reserve commission, ask the CO to record a recommendation in favor (Figure 5-1 Note 1).","Supply desired leave and PTAD dates, duration and planned detachment date with the separation request. Ask IPAC and MMSR-2 to check the target against the message window, the manual window and 120 days plus desired leave/PTAD. Resolve any conflict before submission."],"owner":"CO","due":{"easMonths":-7,"biz":"prev"},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.1","quote":"(Date) I request to resign my commission in the Marine Corps Regular component effective (date) and (do) (do not) desire a Reserve commission. I have been counseled per paragraph 5003 of MCO 1900.16.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MARADMIN 175/24","para":"2","quote":"requests for retirement or resignation will be submitted not more than 18 months and not less than six months prior to the requested retirement or resignation date.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3739611/"},{"ref":"MARADMIN 045/25","para":"2","quote":"Reserve appointments for officers transitioning from the AC to the RC require a minimum of four months from the date received at Headquarters Marine Corps (HQMC) for approval. In cases where the officer was subject to adversity this timeline is increased.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MARADMIN 045/25","para":"3.b.1","quote":"Once the resignation has been approved and an EAS is populated in the resigning officer's record, CMC(RA) will submit for a Reserve commission via the Secretary of Defense.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.d","quote":"If leave is desired in conjunction with a request for separation, the appropriate separation request should be submitted at least 120 days plus the amount of desired leave (to include PTAD) before the effective date of separation. When the request is submitted via unit diary, enter the planned detachment date (PDD) as part of the unit diary request for separation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.e","quote":"Marines anticipating terminal leave in conjunction with separation must inform the CMC (MMSR) of the date and duration of the desired leave upon submission of the request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.2","quote":"The entry must be made not more than 14 months nor less than four months before the requested date of resignation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm routing, submission date, the governing window and 120 days plus desired leave/PTAD before the requested action date.","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-diary","loe":"sep","order":17,"kind":"task","title":"Resignation request entered in MCTFS by unit diary","why":"The unit diary reports your requested resignation date and Reserve commission choice. The MARADMIN prints a 6-to-18-month window, while manual 5003.2 prints a 4-to-14-month window and diary rejection outside it. IPAC and MMSR-2 must confirm acceptance and submission timing.","how":["IPAC reports the resignation on the unit diary (MCTFS PRIUM para 5137) with your requested date.","Confirm the TTC shows your Reserve commission choice.","Supply desired leave and PTAD dates, duration and planned detachment date with the separation request. Ask IPAC and MMSR-2 to check the target against the message window, the manual window and 120 days plus desired leave/PTAD. Resolve any conflict before submission."],"owner":"IPAC","due":{"easMonths":-7,"biz":"prev"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.2","quote":"Submit requests for resignation via the unit diary per reference (cn) MCTFS PRIUM (Online) paragraph 5137... The unit must report the appropriate type transaction code (TTC) request in the unit diary to indicate whether the officer does or does not desire a Reserve commission.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.d","quote":"If leave is desired in conjunction with a request for separation, the appropriate separation request should be submitted at least 120 days plus the amount of desired leave (to include PTAD) before the effective date of separation. When the request is submitted via unit diary, enter the planned detachment date (PDD) as part of the unit diary request for separation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.e","quote":"Marines anticipating terminal leave in conjunction with separation must inform the CMC (MMSR) of the date and duration of the desired leave upon submission of the request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MARADMIN 175/24","para":"2","quote":"requests for retirement or resignation will be submitted not more than 18 months and not less than six months prior to the requested retirement or resignation date.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3739611/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.2","quote":"The entry must be made not more than 14 months nor less than four months before the requested date of resignation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.2","quote":"MCTFS will not accept resignation requests made via unit diary outside the 4 to 14 month window.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm routing, submission date, the governing window and 120 days plus desired leave/PTAD before the requested action date.","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-letter","loe":"sep","order":18,"kind":"task","title":"Figure 5-1 letter with the CO's endorsement (when required)","why":"Required only for a waiver or when the CO will not recommend a Reserve commission. Even when optional it puts the CO's recommendation on paper for Reserve Affairs.","how":["If IPAC wants it sent, it goes to smb.manpower.mmsr2o@usmc.mil by encrypted email."],"owner":"You","due":{"easMonths":-7,"biz":"prev"},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.4","quote":"Submit a letter requesting resignation (Figure 5-1) via the chain of command to the CMC (MMSR-2) via an encrypted email to smb.manpower.mmsr2o@usmc.mil when:... a. A waiver of eligibility criteria of paragraph 5002 is required, or b. An officer requests a Reserve commission but is not recommended for one by the commanding officer.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"Figure 5-1 Note 1","quote":"The reporting senior must recommend and justify either offering or not offering a Reserve commission to the officer submitting the resignation regardless of whether or not they are obligated by law to accept a Reserve commission.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm whether the Figure 5-1 letter and command endorsement are required and the routing date.","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-pcs","loe":"sep","order":19,"kind":"task","title":"Check PCS orders and the resignation cancellation exception","why":"The general rule bars recommendation when PCS orders were issued or notified before the request. The manual permits a cancellation request for an otherwise eligible officer under 5002.3.a(1)-(4). The requested effective date must be no later than the last day of the arrival month. Submission is at least 120 days before estimated arrival and no later than 10 working days after receipt. Paragraph (4) addresses notification less than 120 days before arrival.","how":["Ask the monitor and MMSR-2 whether the cancellation exception applies and calculate its deadlines immediately after receipt.","Record receipt, notification and estimated arrival dates. Route a written request with command endorsements to MMSR-2. Have the office confirm its working-day calendar."],"owner":"You","due":{"easMonths":-7,"biz":"prev"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5002.3a","quote":"Officer resignations will not be recommended for approval if: a. The officer has been issued, or notified that he or she will be issued, Permanent Change of Station (PCS) orders before the date of the officer's request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5002.3.a(1)-(4)","quote":"may request cancellation of the pending assignment provided they request resignation. ... The requested effective date of resignation must be no later than the last day of the month of the estimated date of arrival at the new duty station. ... Resignation requests involving cancellation of PCS orders must be forwarded to the CMC (MMSR-2) via written request with command endorsements. ... Submit the request at least 120 days before the prescribed estimated date of arrival at the new duty station, but no later than 10 working days after receipt of orders. ... Should the notification of orders be less than 120 days from the estimated date of arrival at the new duty station, the effective date of resignation will not be earlier than 120 days from the date of notification, unless the Marine requests otherwise.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"Officer assignments monitor and MMSR-2: confirm eligibility, the paragraph (4) short-notice rule, both submission deadlines and endorsements.","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-approval","loe":"sep","order":20,"kind":"task","title":"Resignation approved and EAS populated in MCTFS","why":"Resignation approval and a populated EAS permit RA to submit the Reserve appointment request. The minimum 4-month processing interval starts at HQMC receipt of that request. A 7-month resignation target does not promise Reserve approval by EAS.","how":["IPAC sees approval through the EDFR.","Check your MOL Basic Individual Record for the EAS.","Ask RAM-1 to confirm and record HQMC receipt of the Reserve appointment request.","HQMC receipt remains pending RAM-1 confirmation after resignation approval. Give Claude the actual receipt date to record on the separate receipt item; the Reserve decision remains separate."],"owner":"MMSR-2","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5003.3","quote":"The CMC will also notify the unit via EDFR once a request is approved.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MARADMIN 045/25","para":"2","quote":"Reserve appointments for officers transitioning from the AC to the RC require a minimum of four months from the date received at Headquarters Marine Corps (HQMC) for approval. In cases where the officer was subject to adversity this timeline is increased.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MARADMIN 045/25","para":"3.b.1","quote":"Once the resignation has been approved and an EAS is populated in the resigning officer's record, CMC(RA) will submit for a Reserve commission via the Secretary of Defense.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"}],"verify":"IPAC, MMSR-2 and RAM-1: confirm resignation approval, populated EAS and actual HQMC receipt of the Reserve appointment request.","status":"waiting","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-orders","loe":"sep","order":21,"kind":"task","title":"Separation orders issued","why":"The unit issues orders once approval posts.","how":[],"owner":"IPAC","due":null,"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5005.1","quote":"Approval/disapproval of a resignation request and authority to release is issued via the unit diary through MCTFS. Units will be notified via EDFR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC: when do orders cut once approval posts?","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"sep-modify","loe":"sep","order":22,"kind":"task","title":"Confirm the resignation change deadline","why":"The manual ties a change request to before 45 days from the resignation date or commencement of separation leave. IPAC and MMSR-2 must confirm both actual anchors. Use a conservative target 46 calendar days before the earlier anchor and move a weekend back. The date stays unresolved until the actual leave start or absence of leave is confirmed.","how":["The date is pending confirmation by IPAC and MMSR-2. Give Claude the date the office confirms and ask Claude to record it on this item. Keep the item open until the action is complete."],"owner":"You","due":null,"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5004.2","quote":"A request for withdrawal or modification of a resignation may be made any time before 45 days from the effective date of the resignation or commencement of separation leave.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm the effective resignation date and actual separation-leave start, calculate the earlier boundary and enter the conservative target date.","status":"open","doneOn":null,"notes":"","when":["resign"],"basis":"target"},{"id":"ret-eligibility-e","loe":"sep","order":23,"kind":"task","title":"IPAC: verify active service and the retirement action","why":"FMCR transfer requires at least 20 years of active duty. Direct retirement requires at least 30. Service obligations must be met and you must be on a valid enlistment or extension. Your grade group and years entered on the board do not establish eligibility.","how":["Ask IPAC to review your Armed Forces Active Duty Base Date (AFADBD), prior active service, lost time and obligations. MMSR verifies creditable service before approval.","Confirm FMCR transfer for 20 to 29 years or direct transfer to the Retired List at 30 or more years. Keep the profile date on the requested or approved action date; record the last active-duty day separately for BDD.","MARADMIN 326/23 applies to the active component and expressly excludes the Marine Corps Reserve. MARADMIN 326/23 sets the enlisted age limit at 58; the manual and MMSR page still print 55. Ask IPAC and MMSR-2 to confirm the applicable age rule before selecting your date. If you are a Reserve Marine retiring on active service, have IPAC and MMSR-2 identify your governing service-limit and age guidance; these MARADMIN limits do not establish it."],"owner":"You","due":{"date":"SETUP"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1401.3.b","quote":"To be eligible for FMCR/retirement, service obligations must be met and the Marine must have 20 or more years of active duty. Enlisted retirement requires at least 30 years of active duty.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1401.2","quote":"The CMC (MMSR) shall verify creditable service toward retirement and the retired pay multiplier (RPM) prior to approval of transfer to the retired list/FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.11","quote":"A Marine must be serving on a valid contract of enlistment or extension to be eligible to retire or transfer to the FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7001.3","quote":"Enlisted Marines must transfer to the FMCR or retired list not later than the last day of the month in which they reach age 55.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MARADMIN 326/23","para":"4","quote":"This MARADMIN is not applicable to the Marine Corps Reserve.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"3.c","quote":"Effective 1 July 2023, the maximum age limit for enlisted Marines’ service is hereby 58 years old.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"HQMC MMSR-2 enlisted retirement guidance","para":"Traditional Retirement","quote":"20-29 years of active service; transfer to the FMCR on the last day of the month. ... 30 or more years of active service; transfer to the Retired List the first day of the month","url":"https://www.manpower.marines.mil/Divisions/Manpower-Management/Separation-and-Retirements-Branch/Active-Duty-Retirements-Separations/"}],"verify":"IPAC and MMSR-2: verify creditable active service, obligations, contract, age rule and FMCR versus Retired List eligibility.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-limits-e15","loe":"sep","order":24,"kind":"task","title":"E-1 to E-5: confirm whether retirement is available","why":"MARADMIN 326/23 applies to the active component and expressly excludes the Marine Corps Reserve. The published Cpl and Sgt limits are 8 and 12 years of active Marine Corps service. They do not establish 20 years of creditable active military service. Ask IPAC to review any prior service or approved exception before relying on this retirement plan. If you are a Reserve Marine retiring on active service, have IPAC and MMSR-2 identify your governing service-limit and age guidance; these MARADMIN limits do not establish it.","how":["These limits do not guarantee continued service. Ask the career planner and IPAC to confirm your record with MMEA for retention and MMSR-2 for retirement processing. Do not assume a waiver."],"owner":"You","due":{"date":"SETUP"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MARADMIN 326/23","para":"4","quote":"This MARADMIN is not applicable to the Marine Corps Reserve.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"3.b.1","quote":"Cpl: 8 years active Marine Corps service Sgt: 12 years active Marine Corps service","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"2.c","quote":"These below service limits do not guarantee continued service; rather eligibility for continued service remains based on Marine Corps warfighting requirements, individual performance, and personal conduct.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.1","quote":"An enlisted Marine of the Regular Marine Corps or Marine Corps Reserve who completes 20 or more years of active duty service in the Armed Forces may request transfer to the FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, unit career planner, MMEA and MMSR-2: confirm actual grade, service limit, creditable active service and any approved exception before relying on retirement eligibility.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted","cat1"],"basis":"target"},{"id":"ret-limits-e67","loe":"sep","order":25,"kind":"task","title":"E-6 to E-7: check your service limit","why":"MARADMIN 326/23 applies to the active component and expressly excludes the Marine Corps Reserve. MARADMIN 326/23 lists SSgt at 20 years and GySgt at 22 years of active military service. Confirm your grade, service limit, obligations and any approval for continued service with IPAC and the career planner. If you are a Reserve Marine retiring on active service, have IPAC and MMSR-2 identify your governing service-limit and age guidance; these MARADMIN limits do not establish it.","how":["These limits do not guarantee continued service. Ask the career planner and IPAC to confirm your record with MMEA for retention and MMSR-2 for retirement processing. Do not assume a waiver."],"owner":"You","due":{"date":"SETUP"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MARADMIN 326/23","para":"4","quote":"This MARADMIN is not applicable to the Marine Corps Reserve.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"3.b.1","quote":"SSgt: 20 years active military service GySgt: 22 years active military service","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"2.c","quote":"These below service limits do not guarantee continued service; rather eligibility for continued service remains based on Marine Corps warfighting requirements, individual performance, and personal conduct.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.1","quote":"An enlisted Marine of the Regular Marine Corps or Marine Corps Reserve who completes 20 or more years of active duty service in the Armed Forces may request transfer to the FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, unit career planner, MMEA and MMSR-2: confirm actual grade, service limit, creditable active service and any approved exception before relying on retirement eligibility.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted","cat2"],"basis":"target"},{"id":"ret-limits-e89","loe":"sep","order":26,"kind":"task","title":"E-8 to E-9: check your service limit","why":"MARADMIN 326/23 applies to the active component and expressly excludes the Marine Corps Reserve. MARADMIN 326/23 lists 1stSgt/MSgt at 27 years and SgtMaj/MGySgt at 30 years of active military service. Confirm your grade and any approved continuation. E-8 alone does not authorize service to 30 years. If you are a Reserve Marine retiring on active service, have IPAC and MMSR-2 identify your governing service-limit and age guidance; these MARADMIN limits do not establish it.","how":["These limits do not guarantee continued service. Ask the career planner and IPAC to confirm your record with MMEA for retention and MMSR-2 for retirement processing. Do not assume a waiver."],"owner":"You","due":{"date":"SETUP"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MARADMIN 326/23","para":"4","quote":"This MARADMIN is not applicable to the Marine Corps Reserve.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"3.b.1","quote":"1stSgt/MSgt: 27 years active military service SgtMaj/MGySgt: 30 years active military service","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MARADMIN 326/23","para":"2.c","quote":"These below service limits do not guarantee continued service; rather eligibility for continued service remains based on Marine Corps warfighting requirements, individual performance, and personal conduct.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3441944/enlisted-active-duty-service-limits/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.1","quote":"An enlisted Marine of the Regular Marine Corps or Marine Corps Reserve who completes 20 or more years of active duty service in the Armed Forces may request transfer to the FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, unit career planner, MMEA and MMSR-2: confirm actual grade, service limit, creditable active service and any approved exception before relying on retirement eligibility.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted","cat3"],"basis":"target"},{"id":"ret-obligations-e","loe":"sep","order":27,"kind":"task","title":"Review tours, deployments, grade and education obligations","why":"Review eligibility before the unit submits your request. GySgt and above normally require 2 years in grade for FMCR transfer. Tour, deployment and education obligations can affect the date. The grade group cannot distinguish SSgt from GySgt.","how":["Ask IPAC and the career planner to review your date of rank and service in grade. A minimum time-in-grade waiver requires DC M&RA approval.","The manual requires requests at least 4 months before deployment and before the unit lock date; carrier deployment requests require at least 9 months. Ask the command and MMSR-2 to confirm applicability and enter any earlier deadline.","Review obligations from PCS orders and courses. The manual bars FMCR transfer before overseas tour completion unless subject to ECFC; the MMSR page allows favorable consideration. Obtain the applicable tour rule and any waiver requirement from MMSR-2.","For attendance under official orders in a military or civilian course lasting 20 weeks or more, 7004.7 requires 24 months of active duty after completion or termination before FMCR transfer. A successfully completed military or civilian course shorter than 20 weeks requires 12 months after completion. Ask MMSR-2 to confirm what applies to your record."],"owner":"You","due":{"item":"ret-request-e","days":-14},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.5.a","quote":"Marines in the grade of gunnery sergeant or above must serve two years in their current grade before transfer to the FMCR. Waiver of this requirement may only be approved by the DC, M&RA.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.4","quote":"Submit requests for transfer to the FMCR at least four months before the deployment date and before the unit’s official lock on date. When assigned to, or in direct support of, a carrier (CV) deployment, submit requests at least nine months before deployment.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.2.a","quote":"Marines serving on an overseas tour will not be approved for transfer to the FMCR before completion of their tour as prescribed in reference (bq) MCO 1300.8, Marine Corps Personnel Assignment Policy, unless subject to ECFC.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"HQMC MMSR-2 enlisted retirement guidance","para":"OCONUS","quote":"Marines serving on an overseas tour may be given favorable consideration to be approved for transfer to the FMCR before completion of their tour as prescribed in MCO 1300.8, unless subject to ECFC.","url":"https://www.manpower.marines.mil/Divisions/Manpower-Management/Separation-and-Retirements-Branch/Active-Duty-Retirements-Separations/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.7","quote":"Marines who have attended a military or civilian course lasting 20 weeks or more will not be approved for transfer to the FMCR before the completion of 24 months of active duty following completion of the course, or after they were terminated from the course, if attendance was in compliance with official orders. Marines who have successfully completed a military or civilian course less than 20 weeks in length will not be approved for transfer to the FMCR before the completion of 12 months active duty following completion of the course.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, career planner, CO and MMSR-2: confirm tour, deployment, education and grade obligations, any earlier submission deadline and required waiver; DC M&RA decides minimum time-in-grade waivers.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-counsel-e","loe":"sep","order":28,"kind":"task","title":"CO counseling and Appendix J before submission","why":"You and the CO sign the retirement preapplication checklist before the request is submitted. The CO counsels you on recall and mobilization. The board targets 7 days before submission; the required sequence is counseling before submission.","how":["Review Appendix J with the CO, including assignments, promotion eligibility, leave and retirement consequences. Sign it and have the CO sign. The command files it in your service record and retains it until retirement.","Appendix J explains that physical disability retirement requires you to be on active duty when the Secretary of the Navy approves PEB proceedings. If disability processing applies, contact your PEBLO and MMSR-2 before proceeding."],"owner":"CO","due":{"item":"ret-request-e","days":-7},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"The Marine requesting action is required to sign a copy of Appendix J from this Manual.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.4.a(3)","quote":"Sign the pre-application checklist to certify that the Marine has been advised of the ramifications of retirement/transfer to the FMCR before the request is submitted.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.4.b","quote":"Counsel the Marine concerning his or her potential for recall to active duty and/or mobilization.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"Appendix J, introduction","quote":"Upon completion, file a copy of this checklist in the Marine’s service record and forward the request via unit diary or other appropriate means to CMC (MMSR). For administrative purposes, the Marine’s parent command will retain the checklist until the actual retirement date.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.3","quote":"in order to qualify for physical disability retirement benefits outlined in 10 U.S.C. Chapter 61, a Marine must be on active duty at the time the Secretary of the Navy approves any proceedings of a Physical Evaluation Board (PEB).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"CO, IPAC and MMSR-2: confirm counseling, both Appendix J signatures and service-record filing before submission; PEBLO confirms any disability processing.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-waiver-e","loe":"sep","order":29,"kind":"task","title":"Confirm any waiver package before submission","why":"A request needing a waiver goes to MMSR-2 through the chain of command by separate correspondence. A diary entry does not request an eligibility waiver. A request outside the current 6-to-18-month window requires an AA Form, justification and CO endorsement.","how":["Ask IPAC and MMSR-2 whether your request needs a waiver. Confirm its form, justification, endorsements and deciding authority before submission. Mark this item not applicable if no waiver is needed.","For a request outside the window, the MMSR page requires O-5 or O-6 CO endorsement. Eligibility and grade waivers have separate approval requirements; a submission does not establish approval."],"owner":"You","due":{"item":"ret-request-e","days":-7},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.8.a","quote":"A Marine requesting waiver of any criteria must submit a written request via the chain of command with justification and endorsements to CMC (MMSR-2). Requests for waivers via unit diary will be disapproved.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"HQMC MMSR-2 enlisted retirement guidance","para":"Outside of 6-18 month window","quote":"Waiver request must be submitted with an AA Form with justification and Commanding Officer Endorsement (O5 or O6) to CMC (MMSR-2E).","url":"https://www.manpower.marines.mil/Divisions/Manpower-Management/Separation-and-Retirements-Branch/Active-Duty-Retirements-Separations/"}],"verify":"IPAC and MMSR-2: determine whether a waiver applies and confirm the package, submission date and deciding authority.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-request-o","loe":"sep","order":30,"kind":"task","title":"Submit the retirement request by unit diary","why":"The MARADMIN window is 6 to 18 months before the date you request; the order's own window is 4 to 14 months. The board sets a planning target of 9 months out, inside both. The target does not decide when approval comes; HQMC does. Do not make big personal commitments on the strength of a submitted request.","how":["Sign Appendix J for the service record.","IPAC submits by unit diary with your requested date.","A request outside the window, or one needing a waiver, goes to MMSR-2 by separate correspondence with the chain's endorsements.","Supply desired leave and PTAD dates, duration and planned detachment date with the separation request. Ask IPAC and MMSR-2 to check the target against the message window, the manual window and 120 days plus desired leave/PTAD. Resolve any conflict before submission."],"owner":"You","due":{"easMonths":-9,"biz":"prev"},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MARADMIN 175/24","para":"2","quote":"requests for retirement or resignation will be submitted not more than 18 months and not less than six months prior to the requested retirement or resignation date.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3739611/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"2004.1","quote":"Submit requests for voluntary retirement, not requiring waivers, via the unit diary system in MCTFS per reference (cn) MCTFS PRIUM (Online). The officer requesting retirement is required to sign a copy of Appendix J from this Manual for inclusion in the electronic service record. Requests for retirement will be submitted not more than 14 months and not less than four months prior to the requested retirement date.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"2004.2","quote":"Officers requesting retirement are cautioned not to make significant personal commitments (such as buying or selling a house or business, or accepting civilian employment) based upon mere submission of a request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.d","quote":"If leave is desired in conjunction with a request for separation, the appropriate separation request should be submitted at least 120 days plus the amount of desired leave (to include PTAD) before the effective date of separation. When the request is submitted via unit diary, enter the planned detachment date (PDD) as part of the unit diary request for separation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.e","quote":"Marines anticipating terminal leave in conjunction with separation must inform the CMC (MMSR) of the date and duration of the desired leave upon submission of the request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm routing, submission date, the governing window and 120 days plus desired leave/PTAD before the requested action date.","status":"open","doneOn":null,"notes":"","when":["retire","officer"],"basis":"target"},{"id":"ret-request-e","loe":"sep","order":31,"kind":"window","title":"Unit diary: submit the enlisted retirement or FMCR request","why":"The current MMSR-2 guidance applies the 6-to-18-month window to retirement and FMCR requests. Manual 7005.1 still prints 4 to 14 months. The board targets 9 months, inside both. Submission does not approve your date; do not make major personal commitments based on submission alone.","how":["After eligibility review and CO counseling, give the reporting unit your signed Appendix J and requested action date. The reporting unit submits by MCTFS unit diary to MMSR-2; IPAC confirms local processing.","Supply desired leave and PTAD dates, duration and planned detachment date with the request. Ask IPAC and MMSR-2 to check 120 days plus desired leave/PTAD and any earlier deployment deadline. Move the target earlier if needed, within the current window.","A request outside the current window goes by separate correspondence with justification and endorsements to MMSR-2. Confirm the AA Form and endorsements on the waiver item."],"owner":"Reporting unit / IPAC","due":{"easMonths":-9,"biz":"prev"},"window":{"from":{"easMonths":-18},"to":{"easMonths":-6}},"critical":true,"presence":true,"cite":[{"ref":"MARADMIN 175/24","para":"2","quote":"requests for retirement or resignation will be submitted not more than 18 months and not less than six months prior to the requested retirement or resignation date.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3739611/"},{"ref":"HQMC MMSR-2 enlisted retirement guidance","para":"Traditional Retirement","quote":"Reporting units must submit requests for retirement/transfer to the FMCR via the unit diary system per (MARADMIN 175/24) MCTFS PRIUM (100210) after having fully determined the Marine’s eligibility based upon the criteria. Timeline. Submit requests for retirement/transfer to the FMCR not more than 18 months and not less than six months before the requested date.","url":"https://www.manpower.marines.mil/Divisions/Manpower-Management/Separation-and-Retirements-Branch/Active-Duty-Retirements-Separations/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"Reporting units must submit requests for retirement/transfer to the FMCR via the unit diary system per reference (cn) MCTFS PRIUM (Online).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.2","quote":"Marines requesting retirement/transfer to the FMCR are cautioned not to make significant personal commitments (such as buying or selling a house or business) based upon mere submission of a request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.d","quote":"If leave is desired in conjunction with a request for separation, the appropriate separation request should be submitted at least 120 days plus the amount of desired leave (to include PTAD) before the effective date of separation. When the request is submitted via unit diary, enter the planned detachment date (PDD) as part of the unit diary request for separation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.e","quote":"Marines anticipating terminal leave in conjunction with separation must inform the CMC (MMSR) of the date and duration of the desired leave upon submission of the request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"Submit requests for retirement/transfer to the FMCR not more than 14 months and not less than four months before the requested date. Requests submitted outside this time frame are not accepted in MCTFS and must be submitted, with justification and endorsements, by separate correspondence or message to CMC (MMSR-2)","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"Retirement must be on the first day of the month. Effective date of transfer to the FMCR will be the last day of the month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.1","quote":"The Marine requesting action is required to sign a copy of Appendix J from this Manual.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm routing, submission date, the governing window and 120 days plus desired leave/PTAD before the requested action date.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-receipt-e","loe":"sep","order":32,"kind":"task","title":"Confirm diary acceptance and HQMC receipt separately","why":"A request flag is not HQMC receipt or approval. The reporting unit confirms acceptance through EDFR and TRF. MMSR-2 acknowledges receipt with a pending flag. The board targets a check 7 days after submission; no source promises receipt within 7 days.","how":["Ask IPAC for the EDFR acceptance and requested date. A request RER flag of 5 or 6 records submission; a pending A or B flag records MMSR-2 acknowledgment.","Record actual submission and HQMC acknowledgment separately in the notes. Keep the approval item waiting until the approved flag posts."],"owner":"IPAC","due":{"item":"ret-request-e","days":7},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7006.1","quote":"Acceptance of the unit diary request will be indicated on the reporting unit’s electronic diary feedback report (EDFR) and the Transaction Research File (TRF). A “request” “5” or “6” ... (RER) flag will post in MCTFS indicating a request submission.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7006.2","quote":"A “request” RER flag does not indicate receipt at Headquarters Marine Corps (HQMC). CMC (MMSR-2) acknowledges receipt of the request by entering a “pending” “A” or “B” RER flag in the unit diary system.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm diary acceptance, requested date and separate HQMC acknowledgment; neither is retirement approval.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-pcs-e","loe":"sep","order":33,"kind":"task","title":"PCS cancellation: submit within 10 working days of receipt","why":"If your FMCR request involves canceling PCS orders, send it to MMSR-2 with MMEA or RAM as an information addressee within 10 working days after receipt. MMEA is not the retirement request destination. MMSR-2 must confirm the requested FMCR date against the PCS criteria.","how":["On receipt of orders, contact IPAC and the assignments monitor. Have them count 10 working days using the applicable office calendar. Give Claude the confirmed deadline and ask Claude to record it on this item. Keep it open until submitted.","Confirm the date rules in 7004.3 with MMSR-2 before requesting PCS cancellation. Mark this item not applicable if no PCS cancellation is involved."],"owner":"You","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7004.3.c","quote":"Requests involving cancellation of PCS orders and transfer to the FMCR must be forwarded to CMC (MMSR-2), with CMC (MMEA or RAM) as an information addressee. Submit the request no later than 10 working days after receipt of orders.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, assignments monitor and MMSR-2: confirm receipt, the 10-working-day deadline and FMCR date; include MMEA or RAM for information.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"rule"},{"id":"ret-report-e","loe":"sep","order":34,"kind":"task","title":"Tell the command about changes after submission","why":"After submission, the command must immediately notify MMSR-2 about medical disqualification, reassignment, promotion or selection, disciplinary action, lost time or death. The requirement continues after approval. The setup date is a planning reminder to review this duty.","how":["Tell IPAC and the command promptly if your status changes. They notify MMSR-2, and MMPR-2 for promotion or selection. If you are referred to IDES, contact your PEBLO; the command requests MMSR-2 disposition instructions. Do not assume the approved release can proceed."],"owner":"CO / IPAC","due":{"date":"SETUP"},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.6","quote":"Once the request for retirement/transfer to the FMCR has been submitted, immediately notify CMC (MMSR-2) if the Marine is: ... Found not physically qualified ... Deceased; ... Reassigned; ... Promoted or selected for promotion (also notify MMPR-2); ... Processed for disciplinary action; or ... Subject of lost time (include number of days and reason).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.6.a","quote":"If the Marine is referred to the Integrated Disability Evaluation System, notify CMC (MMSR-2) with pertinent details and request disposition instructions.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.3","quote":"Once the CMC approval authority is received, immediately notify CMC (MMSR-2) by message when any of the conditions outlined in paragraph 7005.6 occur.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"CO, IPAC and MMSR-2: confirm required notifications and release instructions; MMPR-2 handles promotion notice and PEBLO handles disability processing.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"target"},{"id":"ret-modify-e","loe":"sep","order":35,"kind":"task","title":"If changing the request, submit by 45 days before the action","why":"A request to modify or cancel enlisted retirement or FMCR transfer requires justification and endorsements by separate correspondence to MMSR-2 no later than 45 days before the effective date. Unit diary cannot submit it. MMSR-2 must confirm whether your reason meets the approval criteria.","how":["If you need a change, contact IPAC and MMSR-2 early and submit by the rule deadline. If no change is needed, mark this item not applicable. The board date counts from your action date; have IPAC confirm it against the effective date in your paperwork.","Cancellation requires an unconditional agreement to serve at least 2 years from approval and not request FMCR transfer during that period except for hardship or approaching service limits. It does not authorize service beyond ECFC limits.","After transfer to the FMCR or Retired List, a change request goes to BCNR. Before transfer, MMSR-2 confirms the route and approving authority."],"owner":"You","due":{"eas":-45},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.8.a","quote":"Submit requests to modify or cancel a retirement/transfer to the FMCR with justification and endorsements via separate correspondence to CMC ... not later than 45 days before the effective date. Requests can not be submitted by unit diary.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7005.8.e","quote":"Cancellation requests are unconditional and must include a statement from the Marine agreeing to extend the enlistment for an appropriate service obligation of no less than 2 years from the date the request for cancellation is approved. The Marine must also agree to not submit a request for transfer to the FMCR during that period, except for reasons of hardship or approaching service limits. A Marine will not be authorized service beyond ECFC service limits to meet a cancellation obligation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7019.3","quote":"Requests to change previously approved FMCR/retirement requests after the member has been transferred to the FMCR or retired list must be submitted to the Board for Correction of Naval Records (BCNR).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm applicability, effective date, the 45-day deadline, endorsements and cancellation obligation; BCNR handles changes after transfer.","status":"open","doneOn":null,"notes":"","when":["retire","enlisted"],"basis":"rule"},{"id":"ret-pcs","loe":"sep","order":36,"kind":"task","title":"PCS orders and the retirement request","why":"A retirement request involving PCS cancellation must be submitted no later than 10 working days after receipt of orders to MMSR-2, with MMOA as an information addressee. The deadline is unresolved until receipt and the office working-day calendar are confirmed.","how":["Record the PCS orders receipt date. Have the monitor and IPAC count 10 working days using the office-confirmed calendar. Enter that deadline; weekend adjustment alone cannot count working days.","The date is pending confirmation by the assignments monitor, IPAC and MMSR-2. Give Claude the date the office confirms and ask Claude to record it on this item. Keep the item open until the action is complete."],"owner":"You","due":null,"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"2003.1.d(1)(c)","quote":"Retirement requests involving cancellation of PCS orders must be forwarded to the CMC (MMSR-2) with the CMC (MMOA) as an information addressee. Submit the request no later than 10 working days after receipt of orders.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"Officer assignments monitor, IPAC, MMSR-2 and MMOA: confirm orders receipt, the 10-working-day deadline, submission route and information addressee.","status":"open","doneOn":null,"notes":"","when":["retire","officer"],"basis":"rule"},{"id":"ret-approval","loe":"sep","order":37,"kind":"task","title":"Retirement or FMCR approved and the date populated in MCTFS","why":"Confirm the approved action and date before relying on release authority. For enlisted Marines, MMSR-2 posts approval on EDFR with an approved RER flag of 7 or 8. A request or pending flag is not approval.","how":["Ask IPAC for approval and the approved date. Confirm the last active-duty day separately for BDD.","For enlisted requests, DC M&RA is the final Retired List approval authority; the Director, Manpower Management, has delegated FMCR approval authority. MMSR-2 processes and posts the decision. Do not use a staffing estimate as an approval deadline."],"owner":"MMSR-2","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7001.4","quote":"Final approval authority of requests for transfer to the retired list rests with the DC M&RA. The DC M&RA has delegated approval authority for requests to transfer to the FMCR to the Director, Manpower Management.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7006.3","quote":"CMC (MMSR-2) posts approvals in MCTFS which reflect on the unit’s EDFR with an “approved” RER flag. Written authority for release or issuance of orders is not provided. The “approved” “7” or “8” RER flag is the authority to release.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and MMSR-2: confirm approval, action and date; for enlisted requests, DC M&RA decides Retired List approval and the Director, Manpower Management, decides FMCR approval.","status":"waiting","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"ret-orders","loe":"sep","order":38,"kind":"task","title":"Retirement or FMCR orders issued","why":"The responsible unit issues orders after approval. For enlisted Marines, use Figure 7-1 for FMCR or Figure 7-2 for the Retired List. Release must match the MMSR-2 approved date.","how":["Ask IPAC to confirm the approved date and applicable orders format. Complete the shared transition, STR, SBP and benefits items; this item does not replace those gates."],"owner":"IPAC","due":null,"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7006.3","quote":"The responsible order writing unit will issue orders and provide any required documents.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.4.a","quote":"Issue orders per the format contained in Figure 7-1 or 7-2.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.2","quote":"Release from active duty will not be made on a date other than as directed by the CMC (MMSR-2), unless a modification to the approved date is granted by the CMC (MMSR-2).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, order writing unit and MMSR-2: confirm approval, applicable orders format and release date.","status":"open","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"ret-sbp","loe":"sep","order":39,"kind":"task","title":"Survivor Benefit Plan: counseling and the DD 2656 to DFAS 30 days before retirement","why":"DFAS must have the completed DD 2656 at least 30 days before your date; the board targets 45 to leave slack. Any election short of full coverage needs your spouse's notarized concurrence. No election means full coverage is deducted automatically.","how":["Take the MarineNet SBP counseling course together.","Complete the DD 2656 with IPAC; notarize the spousal concurrence if you elect less than full coverage.","Send it to DFAS by the date on the board and keep the receipt."],"owner":"You and spouse","due":{"eas":-45,"biz":"prev"},"window":null,"critical":true,"presence":true,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1406.1","quote":"A completed election form (DD Form 2656) must be faxed with included Privacy Act form and mailed to DFAS at least 30 days prior to retirement or transfer to FMCR","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1406.5","quote":"Elections other than full coverage require spousal concurrence and must be notarized.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1406.6","quote":"If no election is made prior to the effective date of the retirement, DFAS (by law) will automatically deduct full SBP coverage at the full gross salary rate.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC and DFAS retired pay: confirm DD 2656 submission and receipt at least 30 days before the approved action, election and spousal concurrence.","status":"open","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"ret-pay","loe":"sep","order":40,"kind":"task","title":"Retired pay account: DD 2656, direct deposit, myPay","why":"DFAS pays retired pay from the DD 2656 data. Confirm the direct deposit account and your myPay retiree login before your date.","how":[],"owner":"You","due":{"eas":-45},"window":null,"critical":false,"presence":false,"cite":[],"verify":"DFAS: confirm receipt of the DD 2656 and when the first retired pay posts.","status":"open","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"ret-ceremony","loe":"sep","order":41,"kind":"task","title":"Retirement ceremony: date, venue, guests, flag, certificates","why":"Command practice, not regulation. Settle it early enough for family travel.","how":[],"owner":"You","due":{"eas":-60},"window":null,"critical":false,"presence":false,"cite":[],"verify":"CO: the date, the venue, and who speaks.","status":"open","doneOn":null,"notes":"","when":["retire"],"basis":"target"},{"id":"eas-orders","loe":"sep","order":42,"kind":"task","title":"Separation orders and the final checkout schedule from IPAC","why":"No request is needed to separate at EAS. Orders and the checkout schedule come from IPAC; confirm nothing is pending that extends you.","how":["Tell the career planner you are not reenlisting, in writing if asked.","Confirm your EAS in MOL matches the board."],"owner":"IPAC","due":{"eas":-30},"window":null,"critical":false,"presence":false,"cite":[],"verify":"IPAC: when do orders cut for an EAS separation at your unit?","status":"open","doneOn":null,"notes":"","when":["eas"],"basis":"target"},{"id":"sb-coord","loe":"sb","order":1,"kind":"task","title":"Installation SkillBridge coordinator and the NCMIS application","why":"NCMIS is the system of record. NAVMC directs return to the parent command for requirements below 20 hours per week or 8 hours per day. Confirm how both printed thresholds apply before selecting a program.","how":["Ask the coordinator to verify the approval route and specific provider/program MOU.","Obtain daily and weekly training hours in writing before choosing the program.","This date is a preparation target counted from the proposed start until approval. Give Claude any office-confirmed target date to record. Replace proposed dates on written approval and recheck prerequisites before departure."],"owner":"You","due":{"item":"sb-start","days":-90},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MARADMIN 280/24","para":"4.c","quote":"Installation SkillBridge coordinators are in place to guide, direct, and advise both Marines and commands on SkillBridge protocols. The Navy College Management Information System (NCMIS) is the Marine Corps' SkillBridge system of record.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/3809908/"},{"ref":"NAVMC 1700.2B","para":"11","quote":"Marines shall return to parent commands if SkillBridge program requirements are less than 20 hours per week or eight hours per day and not be on administrative leave status.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"}],"verify":"Installation SkillBridge coordinator and approving command: confirm daily and weekly hours, application of both NAVMC thresholds and the governing approval route.","status":"open","doneOn":null,"notes":"","when":["sb"],"basis":"target"},{"id":"sb-provider","loe":"sb","order":2,"kind":"task","title":"Pick the program and get the acceptance letter","why":"Have the coordinator verify the specific program and provider approval/MOU before applying. Online opportunities must include live person-led training and/or a hybrid with in-person sessions. Asynchronous training must be less than 50 percent of training length.","how":["Get the acceptance letter with location, cost, length, employment outcome and provider contact.","Obtain daily and weekly hours in writing. NAVMC prints return-to-command thresholds below 20 hours per week or 8 hours per day; get their application confirmed before selection.","This date is a preparation target counted from the proposed start until approval. Give Claude any office-confirmed target date to record. Replace proposed dates on written approval and recheck prerequisites before departure."],"owner":"You","due":{"item":"sb-start","days":-75},"window":null,"critical":true,"presence":false,"cite":[{"ref":"NAVMC 1700.2B","para":"Para 7.a(4)","quote":"Obtain a program acceptance letter that provides program details to include location, associated cost, length of... training, employment outcome, and POC for the SkillBridge partner.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"},{"ref":"NAVMC 1700.2B","para":"Para 2","quote":"SkillBridge is not authorized to further civilian education or for experiential purposes per reference (a); securing meaningful employment is the expectation.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"},{"ref":"2026 DoW SkillBridge MOU","para":"4.2.7","quote":"online opportunities must include virtual synchronous (i.e., live person-led) training and/or a hybrid with in-person sessions. Asynchronous training (if any) will be less than 50% of the length of the training.","url":"https://www.skillbridge.mil/static/docs/2026_DoW_SkillBridge_MOU_BLANK.pdf"},{"ref":"NAVMC 1700.2B","para":"11","quote":"Marines shall return to parent commands if SkillBridge program requirements are less than 20 hours per week or eight hours per day and not be on administrative leave status.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"},{"ref":"NAVMC 1700.2B","para":"7.a(3)","quote":"Verify the program meets the required criteria as outlined in Section (4d) above. Verification of DoD approved program with MOU via SkillBridge are located at web portal","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"}],"verify":"Installation SkillBridge coordinator: confirm specific program/provider approval and MOU, online format and both daily and weekly hours before selection.","status":"open","doneOn":null,"notes":"","when":["sb"],"basis":"target"},{"id":"sb-ethics","loe":"sb","order":3,"kind":"task","title":"Ethics course: Developing Your Business Ethics (LLISELF301)","why":"Complete ethics before packet submission and within 12 calendar months before the actual program start. The 61-day lead from a proposed start is a preparation target while approval is pending. Recheck completion and validity against the approved start.","how":["This date is a preparation target counted from the proposed start until approval. Give Claude any office-confirmed target date to record. Replace proposed dates on written approval and recheck prerequisites before departure."],"owner":"You","due":{"item":"sb-start","days":-61},"window":null,"critical":true,"presence":false,"cite":[{"ref":"NAVMC 1700.2B","para":"Para 3.c(2)","quote":"Complete Developing Your Business Ethics (LLISELF301) MarineNet course, or equivalent, within 12 months prior to the program start date","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"},{"ref":"NAVMC 1700.2B","para":"7.a(5)-(6)","quote":"(5) Complete Developing Your Business Ethics (LLISELF301) MarineNet course, or equivalent, within 12 months prior to the program start date per reference (i). ... (6) Obtain commanding officer's endorsement and application approval.","url":"https://www.marines.mil/Portals/1/Publications/NAVMC%201700.2B%20%28SECURED%29.pdf"}],"verify":"Installation SkillBridge coordinator and approving command: confirm ethics completion before packet submission and validity within 12 calendar months before the actual start.","status":"open","doneOn":null,"notes":"","when":["sb"],"basis":"target"},{"id":"sb-ethics-validity","loe":"sb","order":4,"kind":"task","title":"Check ethics validity against the actual start","why":"NAVMC requires ethics completion within 12 calendar months before the actual SkillBridge start. Have the coordinator calculate the valid completion window and recheck it if the start changes.","how":["The date is pending confirmation by the installation SkillBridge coordinator. Give Claude the date the office confirms and ask Claude to record it on this item. Keep the item open until the action is complete.","Give Claude the office-confirmed first and last valid ethics completion dates to record as this item's window. Record the actual program start in its notes. The office-confirmed date for this check is a target; the separate ethics completion target stays on its own item."],"ow
