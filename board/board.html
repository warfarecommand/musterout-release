icipant Guide v6.1","para":"Module 3, p. 80","quote":"Chartered VSOs offer these services for free.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"},{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"To appoint a recognized VSO as your representative, download the VA Form 21-22","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VA benefits office or accredited VSO: confirm accreditation, appointment on VA Form 21-22 and actual intake date.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-shpe","loe":"va","order":2,"kind":"task","title":"Schedule the separation physical (SHPE)","why":"The manual says schedule SHPE at least 6 months before separation. The VA guide says a completed SHA returned to DoD at least 30 days before separation can satisfy the discharge examination requirement. Confirm the clinic accepts the completed and returned SHA; a scheduled VA exam alone does not satisfy this condition.","how":[],"owner":"You","due":{"easMonths":-6},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1011.2","quote":"A Marine should schedule a SHPE medical evaluation not less than six months before the effective date of separation to allow time for necessary medical treatment or disability processing.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"If you complete your SHA exam and return it to DOD at least 30 days before separation, it will serve as your DOD discharge exam, and you will not need to complete a SHPE.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"Military medical clinic and VA: confirm scheduling, SHA completion and return to DoD, and whether a separate SHPE remains required.","status":"open","doneOn":null,"notes":"","when":[],"basis":"rule"},{"id":"va-records","loe":"va","order":3,"kind":"task","title":"Export complete medical, dental and service records","why":"Keep personal copies for your BDD claim and record review. The VA guide requires scanned physical, electronic and applicable civilian records for your entire service history. Personal export does not satisfy delivery of the complete STR to IPAC.","how":["Request complete military medical and dental records, including older paper records.","Request civilian medical and dental records. Confirm the export needed for the claim and STR.","Complete the separate STR delivery gate before the first applicable absence or separation action."],"owner":"You","due":{"eas":-190},"window":null,"critical":false,"presence":false,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"Provide a copy of your scanned physical records, electronic medical records and outsourced civilian records (if applicable) for your entire service history.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1101.7.b","quote":"Every Marine must submit their Service Treatment Record (STR) to their Marine Corps activity effecting separations (IPAC/Administration RUC) prior to execution of transitional PTAD, terminal leave, transfer to the IRR, separation or retirement. A complete STR includes: Service provided medical and dental documentation, civilian provided medical and dental documentation, Armed Forces Health Longitudinal Technology Application (AHLTA) web print (AWP) information, and a completed DD Form 2963.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"Military medical records office, VA and IPAC: confirm complete exports, records for BDD and STR delivery/acceptance before the first applicable action.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-service-end","loe":"va","order":4,"kind":"milestone","title":"Confirmed last day of active duty","why":"The BDD window uses the last active-duty day. For ordinary Retired List retirement, the manual makes that the day before the effective retirement date. IPAC and MMSR-2 must confirm FMCR, exception and other individual service-end dates separately from the approved action date.","how":["The last active-duty day is pending IPAC and MMSR-2 confirmation. Give Claude that date and the separate approved retirement or FMCR action date. Ask Claude to record the confirmed last active-duty day here and the action date on the retirement/FMCR item.","Have VA or your accredited VSO confirm both BDD window endpoints. Keep this milestone's date equal to the confirmed last active-duty day when recording completion."],"owner":"You","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.1.a","quote":"The first day of the month is the effective date of retirement and the last day of active duty is the preceeding day.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"7007.1.b","quote":"Transfer to the FMCR is effected on the last day of the month and Marines assume a status in the FMCR on the first day of the following month.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"Submit your BDD claims between 180 and 90 days before the very last day of service on active duty. For BDD purposes, this separation date is not when you start Transitional or Terminal Leave or Permissive Temporary Duty for seeking a home.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"IPAC and MMSR-2: confirm the last active-duty day separately from the Retired List/FMCR action. VA benefits office or accredited VSO: confirm the BDD window counted from that service-end date.","status":"open","doneOn":null,"notes":"","when":[],"basis":"rule"},{"id":"va-str","loe":"va","order":5,"kind":"task","title":"Deliver the complete STR before absence or separation","why":"Submit the complete STR to IPAC/Administration RUC before transition PTAD, terminal leave, IRR transfer, separation or retirement. Include service and civilian medical/dental records, the required AHLTA web print and DD Form 2963. Confirm the required export with medical records and IPAC.","how":["The date is pending confirmation by the military medical records office and IPAC. Give Claude the date the office confirms and ask Claude to record it on this item. Keep the item open until the action is complete."],"owner":"You","due":null,"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1101.7.b","quote":"Every Marine must submit their Service Treatment Record (STR) to their Marine Corps activity effecting separations (IPAC/Administration RUC) prior to execution of transitional PTAD, terminal leave, transfer to the IRR, separation or retirement. A complete STR includes: Service provided medical and dental documentation, civilian provided medical and dental documentation, Armed Forces Health Longitudinal Technology Application (AHLTA) web print (AWP) information, and a completed DD Form 2963.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"Military medical records office and IPAC: enter the delivery deadline and confirm the required export and acceptance of the complete STR before the first applicable action.","status":"open","doneOn":null,"notes":"","when":[],"basis":"rule"},{"id":"va-conditions","loe":"va","order":6,"kind":"task","title":"Build the co ts and Services Participant Guide v6.1","para":"Module 3","quote":"Submit your BDD claims between 180 and 90 days before the very last day of service on active duty. For BDD purposes, this separation date is not when you start Transitional or Terminal Leave or Permissive Temporary Duty for seeking a home.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"},{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"Be available 45 days after submitting your BDD claim to attend the required medical exam(s)","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VA benefits office or accredited VSO: confirm the known service-end date, actual filing date, required records, Part A and 45-day examination availability.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-exams","loe":"va","order":14,"kind":"window","title":"VA exams (you must be available 45 days after filing)","why":"A planning target. Until you mark the BDD filing done, this window is projected from the filing target; once it is done, it counts from the day you filed. VA schedules the exams after you file, and you must be available for 45 days from the filing date. Where the exams are, and whether exam days count as duty time, are questions for VA and IPAC.","how":[],"owner":"You","due":{"item":"va-file","days":45},"window":{"from":{"item":"va-file","days":0},"to":{"item":"va-file","days":45}},"critical":false,"presence":true,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"Be available 45 days after submitting your BDD claim to attend the required medical exam(s)","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VSO: the day the claim was filed and the exam dates VA gives you. VA and IPAC: exam location, and duty status for exam days.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-add","loe":"va","order":15,"kind":"task","title":"Confirm late additions with VA before BDD closes","why":"The copied guide establishes BDD filing between 180 and 90 days before the final active-duty day. It does not establish the procedure for adding conditions to an existing BDD claim. Confirm that procedure with VA before the window closes.","how":["Day 90 before the last active-duty day is a planning target for confirming additions with VA or your accredited VSO. The additions procedure and actual deadline remain pending VA confirmation.","Give Claude any deadline VA confirms to record as a date rule on this task or a separate actionable task. Record the confirming office and its confirmation in notes. Label that date a confirmed event and preserve the day-90 planning target separately. Use basis rule only if a quoted source sets the deadline."],"owner":"You","due":{"item":"va-service-end","days":-90},"window":null,"critical":true,"presence":false,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"Submit your BDD claims between 180 and 90 days before the very last day of service on active duty. For BDD purposes, this separation date is not when you start Transitional or Terminal Leave or Permissive Temporary Duty for seeking a home.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VA benefits office or accredited VSO: confirm the procedure and actual deadline for adding conditions to your existing claim.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-sha","loe":"va","order":16,"kind":"task","title":"SHA return cutoff if using it instead of a SHPE","why":"If the SHA is used instead of a separate SHPE, return completed results to DoD at least 30 days before your confirmed last active-duty day. The military medical clinic and VA must confirm applicability, return and acceptance. The cutoff stays pending until the office confirms your service-end date.","how":[],"owner":"Medical","due":{"item":"va-service-end","days":-30},"window":null,"critical":false,"presence":false,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3","quote":"If you complete your SHA exam and return it to DOD at least 30 days before separation, it will serve as your DOD discharge exam, and you will not need to complete a SHPE.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"Military medical clinic and VA: confirm completed SHA results returned to DoD by the required date and whether SHPE is still needed.","status":"open","doneOn":null,"notes":"","when":[],"basis":"rule"},{"id":"va-decision","loe":"va","order":17,"kind":"milestone","title":"VA rating decision","why":"BDD aims for a decision at or soon after separation.","how":[],"owner":"VA","due":{"eas":30},"window":null,"critical":false,"presence":false,"cite":[],"verify":null,"status":"waiting","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-health","loe":"va","order":18,"kind":"task","title":"Enroll in VA health care","why":"The guide permits application no earlier than 1 year before separation and any time afterward. It sets no general application deadline. Have VA confirm individual eligibility and coordinate your other coverage.","how":[],"owner":"You","due":{"eas":30},"window":null,"critical":false,"presence":false,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 2, p. 41","quote":"You may apply no earlier than one year before separation, but any time after separation. There is no deadline to apply for VA health care.","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VA benefits office: confirm eligibility, application status and the care start date.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-drill","loe":"va","order":19,"kind":"task","title":"Set up the yearly VA and drill pay reconciliation","why":"The copied pack does not establish how to count paid training days or complete the VA waiver notice. Have VA and your gaining Reserve unit reconcile actual fiscal-year paid days and confirm the notice deadline. Do not assume every 2-day weekend has 4 paid assemblies.","how":["Ask VA and the unit for the applicable notice and instructions. Compare the actual paid assemblies and active-duty days with the notice and respond by its confirmed deadline.","Paid-day counting, the applicable notice instructions and response deadline remain pending VA benefits office and gaining Reserve unit administration confirmation."],"owner":"You","due":{"eas":60},"window":null,"critical":false,"presence":false,"cite":[],"verify":"VA benefits office and gaining Reserve unit administration: confirm paid-day counting, discrepancies, the applicable notice and response deadline.","status":"open","doneOn":null,"notes":"","when":["reserve"],"basis":"target"},{"id":"va-dental","loe":"va","order":20,"kind":"task","title":"Confirm VA dental eligibility and application deadline","why":"The manual prints 180 days of service and application within 90 days after release. It also uses the DD 214 certification of a complete exam and all appropriate treatment within 90 days before separation. The copied pack does not establish current Class II criteria. VA dental must settle your eligibility and deadline promptly.","how":["Current Class II criteria and application deadline remain pending VA dental clinic confirmation."],"owner":"You","due":{"eas":30},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1101.4.e(1)-(3)","quote":"The veteran must have served not less than 180 days of active duty to be eligible for dental treatment provided by VA. ... Application for VA dental treatment must be made within 90 days of discharge or release from active duty. ... The veteran will not be eligible for dental treatment if the DD Form 214 contains a statement that the veteran was provided a complete dental ... examination and all appropriate dental services and treatment were completed within 90 days before separation from active duty.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"VA dental clinic and accredited VSO: confirm current Class II service/discharge criteria, the DD 214 examination/treatment entry and actual application deadline. IPAC: confirm the entry.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"va-net","loe":"va","order":21,"kind":"marker","title":"Confirm the claim effective date and 1-year filing boundary","why":"The guide illustrates a claim received within 1 year of separation becoming effective the day after separation. That example does not decide individual entitlement. Have VA confirm your claim effective date and filing deadline.","how":[],"owner":"You","due":{"easMonths":12},"window":null,"critical":false,"presence":false,"cite":[{"ref":"VA Benefits and Services Participant Guide v6.1","para":"Module 3, p. 73","quote":"Because VA received it within one year of your separation, your claim is effective on October 19, 2019","url":"https://tapevents.mil/Assets/ResourceContent/TAP/VA-Benefits-Participant-Guide.pdf"}],"verify":"VA benefits office or accredited VSO: confirm the individual effective date, entitlement and filing deadline before the 1-year boundary.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"dap-ram1","loe":"dap","order":1,"kind":"task","title":"Email RAM-1: Reserve commission timeline","why":"Resignation approval and a populated EAS permit RA submission. Reserve appointment approval requires at least 4 months from HQMC receipt of the request, with more time for adverse cases. Record and confirm that receipt date; the resignation planning target does not promise approval by EAS.","how":["Give RAM-1 the requested separation date and ask about the applicable scroll.","Confirm and record HQMC receipt of the Reserve appointment request with RAM-1.","Ask RAM-1 to confirm processing time and Reserve appointment status.","Give Claude the actual HQMC receipt date that RAM-1 confirms to record on the separate receipt item. The date RAM-1 replies is not the receipt date."],"owner":"You","due":{"easMonths":-7,"biz":"prev"},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MARADMIN 045/25","para":"2","quote":"Reserve appointments for officers transitioning from the AC to the RC require a minimum of four months from the date received at Headquarters Marine Corps (HQMC) for approval. In cases where the officer was subject to adversity this timeline is increased.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MARADMIN 045/25","para":"3.b.1","quote":"Once the resignation has been approved and an EAS is populated in the resigning officer's record, CMC(RA) will submit for a Reserve commission via the Secretary of Defense.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5004 (Reserve commission scrolling)","quote":"Officers without adverse information in any Department of the Navy systems of record are then placed on the non-adverse scroll and routed from HQMC, RA Division via the DC M&RA to the SecDef. The non-adverse transitional scrolling process may require a longer lead time than the minimum length of time required by the resignation process (four months per paragraph 5003 of this Manual).","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"RAM-1, IPAC and MMSR-2: confirm HQMC receipt date, populated EAS, scroll and remaining processing interval.","status":"open","doneOn":null,"notes":"","when":["reserve","resign"],"basis":"target"},{"id":"dap-receipt","loe":"dap","order":2,"kind":"task","title":"RAM-1 confirms HQMC receipt of the Reserve appointment request","why":"The minimum 4-month processing interval starts at HQMC receipt of the Reserve appointment request. EAS minus 4 calendar months is the latest ordinary receipt planning boundary, not an approval guarantee. Adverse cases need more time. Actual receipt remains pending RAM-1 confirmation.","how":["Ask RAM-1 for the actual HQMC receipt date. Give Claude that date and ask Claude to record completion with the actual receipt date on this item. Keep it waiting until RAM-1 confirms receipt.","The Reserve appointment decision is separate. IPAC and RAM-1 must confirm approval in MCTFS on the existing commission item."],"owner":"You","due":{"easMonths":-4},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MARADMIN 045/25","para":"2","quote":"Reserve appointments for officers transitioning from the AC to the RC require a minimum of four months from the date received at Headquarters Marine Corps (HQMC) for approval. In cases where the officer was subject to adversity this timeline is increased.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MARADMIN 045/25","para":"3.b.1","quote":"Once the resignation has been approved and an EAS is populated in the resigning officer's record, CMC(RA) will submit for a Reserve commission via the Secretary of Defense.","url":"https://www.marines.mil/News/Messages/Messages-Display/Article/4047837/"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"5004.1.b(1)","quote":"The non-adverse transitional scrolling process does not begin until HQMC (RA Division) receives notice of an officer's commission request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"RAM-1, IPAC and MMSR-2: confirm the actual HQMC receipt date separately from resignation approval and the Reserve appointment decision.","status":"waitin On":null,"notes":"","when":["reserve"],"basis":"rule"},{"id":"lv-ledger","loe":"leave","order":1,"kind":"task","title":"Enter your leave balance from the LES","why":"The leave model needs the real number. Update it each month.","how":[],"owner":"You","due":{"date":"SETUP"},"window":null,"critical":false,"presence":false,"cite":[],"verify":null,"status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"lv-plan","loe":"leave","order":2,"kind":"task","title":"Leave plan: decide the balance you want at the end, then plan the blocks","why":"The desired final balance is your planning choice. Sellback depends on honorable separation, prior sales and any chapter 2, 2.b exception to the 60-day career cap. A projected negative balance does not authorize advance leave. Confirm the urgent, personal or emergency purpose, limits and CO approval. A negative balance at discharge becomes excess leave subject to collection from pay.","how":["The payable amount and any cap exception remain pending IPAC and disbursing confirmation."],"owner":"You","due":{"eas":-180},"window":null,"critical":true,"presence":false,"cite":[{"ref":"MCO 1050.3J","para":"Ch 2 para 9.c(9)","quote":"Separation payments for unused accrued leave are limited to 60 days during a military career per reference (q).","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1050.3J","para":"Ch 2 para 2.b","quote":"A Marine who is separated or released from active duty under honorable conditions may elect to receive payment for a portion of the unused leave ... Payment of leave for Reserve Component (RC) Marines or Retired Marines activated in support of a contingency operation or RC Marines on Active Duty Operational Support (ADOS) orders not exceeding 365 days are exempt from the 60-day leave payment limitation per reference (q).","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1050.3J","para":"Ch 2 para 6.a","quote":"Advance leave is a means whereby Marines with limited or no accrued leave may be granted leave to resolve urgent, personal, or emergency situations. ... advance leave resulting in a negative leave balance on date of discharge, or release from active duty, becomes excess leave and is subject to checkage of pay and allowances.","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1050.3J","para":"Ch 2 para 6","quote":"advance leave shall be limited to the lesser of: (1) 45 days or (2) The amount of leave that shall be earned during the remaining period of active duty","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1050.3J","para":"Ch 2 para 6.d","quote":"Accrued leave shall be expended prior to the authorization of advance leave.","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2e","quote":"Do not approve leave in excess of the number of days which the Marine can accrue before the end of current contract (ECC). Leave taken beyond that which can be earned is excess leave and results in nonentitlement to pay and allowances.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"}],"verify":"IPAC, disbursing and CO: confirm qualifying sellback, prior sales, any cap exception and advance-leave purpose, limits and approval.","status":"open","doneOn":null,"notes":"","when":[],"basis":"target"},{"id":"lv-terminal","loe":"leave","order":3,"kind":"task","title":"Confirm the previously requested terminal leave and PTAD dates","why":"Supply desired leave/PTAD dates, duration and planned detachment date with the advance separation request. The manual says to allow 120 days plus desired leave/PTAD lead time. The 90-day board date is a final planning confirmation target. Confirm STR acceptance and all separation requirements before the first applicable absence.","how":[],"owner":"You","due":{"eas":-90},"window":null,"critical":false,"presence":false,"cite":[{"ref":"MCO 1050.3J","para":"Ch 5 para 1.c(11)(a)5","quote":"Officers and enlisted Marines with an approved retirement date are eligible for transition PTAD.","url":"https://www.marines.mil/portals/1/publications/mco%201050.3j.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.d","quote":"If leave is desired in conjunction with a request for separation, the appropriate separation request should be submitted at least 120 days plus the amount of desired leave (to include PTAD) before the effective date of separation. When the request is submitted via unit diary, enter the planned detachment date (PDD) as part of the unit diary request for separation.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2.e","quote":"Marines anticipating terminal leave in conjunction with separation must inform the CMC (MMSR) of the date and duration of the desired leave upon submission of the request.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1010.2","quote":"Terminal leave is not granted until all separation requirements--both administrative and medical--are complete. Terminal leave runs continuously from the first day of leave until the date of EAS or transfer to the Retired List/FMCR.","url":"https://www.marines.mil/Portals/1/Publications/MCO%201900.16%20ADMIN%20CH-3%20%28SECURED%29.pdf"},{"ref":"MCO 1900.16 CH-3 (MARCORSEPMAN)","para":"1101.7.b","quote":"Every Marine must submit their Service Treatment Record (STR) to their Marine Corps activity effecting separations (IPAC/Administration RUC) prior to execution of transitional PTAD, terminal leave, transfer to the IRR, separation or retirement. A complete STR includes: Service provided medical and dental documentation, civilian provided medical a var S = {

  items: {}, contacts: clone(SEED.contacts), blocks: clone(SEED.blocks || []), conditions: [], claim: clone(SEED.claim || {}), links: [], inbox: [], profile: clone(SEED.profile || {}), watch: null, watchError: null, reset: null, seeded: null, seeding: null, dbState: "init", dbIds: { items: {}, loes: {}, contacts: {}, claim: {} },
  live: false, dbEmpty: false, canWrite: null, readOnly: true, release: null, install: null, installLoaded: false

if (location.hash && TABS.some(function(x){ return "#" + x[0] === location.hash; })) UI.tab = location.hash.slice(1);
var DB = null, SAMPLE = null;

/* ---------- dates ---------- */
function parseD(s){ if (!s) return null; var p = s.split("-").map(Number); return Date.UTC(p[0], p[1]-1, p[2]); }
function iso(t){ return new Date(t).toISOString().slice(0,10); }

function eLabel(t, eas){ if (t == null) return ""; var n = diff(t, eas); return n === 0 ? "E-DAY" : (n < 0 ? "E" + n : "E+" + n); }
function isDuty(t){ var w = dow(t); return w !== 0 && w !== 6 && HOLIDAYS.indexOf(iso(t)) < 0; }

function ctx(shift){
  /* MUSTEROUT_R3A: each SkillBridge endpoint resolves on its own; only a missing one stays pending */
  var eas = addDays(parseD(S.settings.eas), shift || 0), sbs = parseD(S.settings.sbStart), sbe = parseD(S.settings.sbEnd);
  if (!hasSb()) { sbs = null; sbe = null; }
  if (shift) { if (sbs != null) sbs = addDays(sbs, shift); if (sbe != null) sbe = addDays(sbe, shift); }
  return { eas: eas, sbStart: sbs, sbEnd: sbe };

function resolve(rule, c, depth){

  if (rule.date) t = parseD(rule.date);
  else if ("eas" in rule) t = addDays(c.eas, rule.eas);
  else if ("easMonths" in rule) t = addMonths(c.eas, rule.easMonths);
  else if (rule.sb) t = rule.sb === "start" ? c.sbStart : c.sbEnd;
  else if (rule.item) {
    var it = S.items[rule.item]; if (!it || depth > 5) return null;
    var base = it.doneOn && it.kind !== "milestone" ? parseD(it.doneOn) : resolve(it.due, c, depth+1);
    if (base == null) return null; t = addDays(base, rule.days || 0);
  }
  if (t != null && rule.biz === "prev") t = prevBiz(t);
  return t;
}
function dueOf(it, c){ return resolve(it.due, c || ctx()); }
function winOf(it, c){ if (!it.window) return null; c = c || ctx(); var a = resolve(it.window.from, c), b = resolve(it.window.to, c); return (a == null || b == null) ? null : { from: a, to: b }; }
function partWin(it, c){ if (!it.window) return null; c = c || ctx(); var a = resolve(it.window.from, c), b = resolve(it.window.to, c); return (a == null) === (b == null) ? null : { from: a, to: b }; }
function endOf(it, c){ var w = winOf(it, c); return w ? w.to : dueOf(it, c); }
function closed(it){ return it.status === "done" || it.status === "na"; }
function lateOf(it){ if (closed(it) || it.kind === "marker") return false; var e = it.kind === "window" ? endOf(it) : dueOf(it); return e != null && e < today(); }
function itemsArr(){ return Object.keys(S.items).map(function(k){ return S.items[k]; }); }
function sortByDue(a, b){ var da = dueOf(a), db = dueOf(b); if (da == null && db == null) return (b.critical - a.critical); if (da == null) return 1; if (db == null) return -1; return da - db || (b.critical - a.critical); }
function loeItems(id){ return itemsArr().filter(function(i){ return i.loe === id; }).sort(function(a,b){ return (a.order||0) - (b.order||0); }); }
function progress(id){ var xs = itemsArr().filter(function(i){ return (!id || i.loe === id) && i.kind !== "marker" && i.status !== "na"; }); var d = xs.filter(function(i){ return i.status === "done"; }).length; return { done: d, total: xs.length }; }
function loeName(id){ var l = S.loes.find(function(x){ return x.id === id; }); return l ? l.name : id; }

/* ---------- leave math ---------- */
function leaveModel(c){
  c = c || ctx(); var L = S.ledger; if (L.balance == null || !L.asOf) return null;
  var start = parseD(L.asOf), eas = c.eas, rate = Number(L.accrualPerMonth || 2.5);
  var charged = {};
  S.blocks.forEach(function(b){ if (!b.start || !b.end || b.kind === "liberty" || b.kind === "ptad" || b.status === "cancel") return; for (var t = parseD(b.start); t <= parseD(b.end); t += DAY) charged[t] = (charged[t] || 0) + 1; });
  var bal = Number(L.balance), pts = [{ t: start, v: bal }], min = { t: start, v: bal }, acc = 0, sbAcc = 0, used = 0;
  for (var t = start + DAY; t <= eas; t += DAY) {
    var d = new Date(t), next = new Date(t + DAY), credit = 0;
    if (next.getUTCMonth() !== d.getUTCMonth()) credit = rate;
    if (t === eas && next.getUTCMonth() === d.getUTCMonth()) credit = Math.min(rate, 0.5 * Math.ceil(d.getUTCDate() / 6));
    bal += credit; acc += credit; if (c.sbStart != null && t >= c.sbStart && t <= eas) sbAcc += credit;
    if (charged[t]) { bal -= charged[t]; used += charged[t]; }
    pts.push({ t: t, v: bal }); if (bal < min.v) min = { t: t, v: bal };
  }
  return { pts: pts, end: bal, min: min, accrued: acc, sbAccrued: sbAcc, used: used, start: start, eas: eas };
}
function blockDays(b){ return (b.start && b.end) ? diff(parseD(b.end), parseD(b.start)) + 1 : 0; }
function blockOp(b){ return b.status === "approved" ? 1 : b.status === "requested" ? 0.75 : b.status === "known" ? 0.55 : 0.28; }
function blockStyle(b){
  if (b.kind === "liberty") return "fill:url(#libhatch);stroke:var(--ink-3);stroke-width:1";
  if (b.status === "cancel") return "fill:none;stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 2";
  var op = blockOp(b); return "fill:var(--ink);fill-opacity:" + op + ";stroke:var(--ink);stroke-opacity:" + Math.min(1, op + 0.2) + ";stroke-width:1";
}
function blockLabel(b){ if (b.kind === "liberty") return "Liberty, not charged"; if (b.kind === "ptad") return "PTAD, not charged as leave"; return ({ approved: "Approved leave", requested: "Requested leave", known: "Known leave", planned: "Proposed leave", cancel: "Approved, cancel in MOL" })[b.status] || b.status; }
function hatchDefs(id){ return '<defs><pattern id="' + id + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--ink-3);stroke-width:2"/></pattern></defs>'; }
function monthly(c){
  var L = S.ledger; if (L.balance == null || !L.asOf) return [];
  var start = parseD(L.asOf), rate = Number(L.accrualPerMonth || 2.5), rows = {}, order = [];
  function key(t){ var d = new Date(t); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }
  function row(k){ if (!rows[k]) { rows[k] = { k: k, appr: 0, plan: 0, acc: 0, end: 0 }; order.push(k); } return rows[k]; }
  S.blocks.forEach(function(b){ if (!b.start || !b.end || b.kind === "liberty" || b.kind === "ptad" || b.status === "cancel") return;
    for (var t = parseD(b.start); t <= parseD(b.end); t += DAY) { if (t <= start || t > c.eas) continue; var r = row(key(t)); if (b.status === "approved") r.appr++; else r.plan++; } });
  for (var t = start + DAY; t <= c.eas; t += DAY) { var d = new Date(t), nx = new Date(t + DAY), cr = 0;
    if (nx.getUTCMonth() !== d.getUTCMonth()) cr = rate; if (t === c.eas && nx.getUTCMonth() === d.getUTCMonth()) cr = Math.min(rate, 0.5 * Math.ceil(d.getUTCDate() / 6));
    if (cr) row(key(t)).acc += cr; }
  order.sort(function(a, b){ return a - b; }); var bal = Number(L.balance);
  return order.map(function(k){ var r = rows[k]; bal += r.acc - r.appr - r.plan; r.end = bal; return r; });
}
/* ---------- days in the office ---------- */
var FEDHOL = HOLIDAYS;
function awayMap(c){
  var off = {};
  S.blocks.forEach(function(b){ if (!b.start || !b.end || b.status === "cancel") return; for (var t = parseD(b.start); t <= parseD(b.end); t += DAY) off[t] = 1; });
  if (c.sbStart && c.sbEnd) for (var t = c.sbStart; t <= c.sbEnd; t += DAY) off[t] = 1;
  return off;
}
function isWorkday(t){ var wd = new Date(t).getUTCDay(); return wd !== 0 && wd !== 6 && FEDHOL.indexOf(iso(t)) < 0; }
function officeDays(c, a, z, off){ off = off || awayMap(c); var n = 0; for (var t = a; t < z; t += DAY) if (!off[t] && isWorkday(t)) n++; return n; }
function officeMonths(c){
  var t0 = today(), d = new Date(t0), m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1), off = awayMap(c), out = [];
  for (; m < c.eas; m = addMonths(m, 1)) { var a = Math.max(m, t0), z = Math.min(addMonths(m, 1), c.eas); if (z <= a) continue;
    var md = new Date(m); out.push({ k: md.getUTCFullYear() * 12 + md.getUTCMonth(), a: a, z: z, n: officeDays(c, a, z, off) }); }
  return out;
}
function officeRuns(c){
  /* stretches between leave, liberty and SkillBridge, with the office days in each; fa and la are the first and last office day */
  var off = awayMap(c), runs = [], cur = null;
  for (var t = today(); t < c.eas; t += DAY) {
    if (off[t]) { if (cur) { runs.push(cur); cur = null; } continue; }
    if (!cur) cur = { n: 0, fa: null, la: null };
    if (isWorkday(t)) { cur.n++; if (cur.fa == null) cur.fa = t; cur.la = t; }
  }
  if (cur) runs.push(cur);
  return runs.filter(function(r){ return r.n > 0; });
}
function leaveWarnings(c){
  c = c || ctx(); var out = [], presence = itemsArr().filter(function(i){ return i.presence && !closed(i); });
  S.blocks.forEach(function(b){
    if (!b.start || !b.end || b.kind === "liberty" || b.status === "cancel") return; var s = parseD(b.start), e = parseD(b.end);
    if (e < s) { out.push({ k: "red", t: "A leave block ends before it starts (" + mil(s) + ")." }); return; }
    if (e >= c.eas) out.push({ k: "red", t: "Leave block " + mil(s) + " to " + mil(e) + " runs past EAS." });
    if (c.sbStart == null) { /* SkillBridge start pending: no overlap or gap check */ }

function setupStop(msg, focusId){ toast(msg); var pr = el("su-prog"); if (pr) pr.textContent = msg; if (focusId && el(focusId)) el(focusId).focus(); return null; }
function readSetup(mode){
  /* MUSTEROUT_R2A: same nullable contract as /intake. Blank optional fields are stored as null; nothing is invented. */
  var v = function(id){ var e = el(id); return e ? String(e.value).trim() : ""; };
  var isDate = function(x){ return /^\d{4}-\d{2}-\d{2}$/.test(x) && iso(parseD(x)) === x; };
  var path = v("su-path"), grade = v("su-grade"), date = v("su-date");
  if (path === "other") return setupStop("This board does not cover that path, and it would look complete while being wrong for you. Read the support page for who to call: https://musterout.warfarecommand.com/support/.", "su-path");
  if (!path) return setupStop("Choose your path first.", "su-path");
  if (!isDate(date)) return setupStop("Enter your EAS or retirement date first.", "su-date");
  if (!grade) return setupStop("Choose your grade group first.", "su-grade");
  var g = gradeRow(grade);
  if (path === "resign" && g[2] === "enlisted") return setupStop("Resigning a regular commission is an officer path. Choose Separating at EAS or Retiring.", "su-path");
  var sb = v("su-sb") === "yes", reserve = v("su-reserve") === "yes" && path !== "retire";
  var sbs = sb && isDate(v("su-sbstart")) ? v("su-sbstart") : null, sbe = sb && isDate(v("su-sbend")) ? v("su-sbend") : null;
  if (sbs && sbe && (parseD(sbs) > parseD(sbe) || parseD(sbe) >= parseD(date))) return setupStop("SkillBridge must start before it ends, and end before your date.", "su-sbstart");
  var basis = v("su-basis"), yrs = v("su-years"), opt = function(id){ return v(id) || null; };
  var edit = mode === "edit";
  var profile = Object.assign(edit ? clone(S.profile || {}) : {}, { name: opt("su-name"), grade: grade, path: path, reserve: reserve, sb: sb, years: yrs && !isNaN(parseInt(yrs, 10)) ? parseInt(yrs, 10) : null, home: opt("su-home"), base: opt("su-base"), family: opt("su-family"), demo: !!(el("su-demo") && el("su-demo").checked), dateBasis: basis === "planned" || basis === "approved" ? basis : null, version: VERSION, updated: nowIso() });
  var planSet = S.settings.planSet && S.settings.planSet !== "SETUP" && !S.settings.placeholder ? S.settings.planSet : iso(today());
  var settings = Object.assign(edit ? clone(S.settings) : {}, { eas: date, sbStart: sbs, sbEnd: sbe, planSet: planSet }); delete settings.placeholder;
  var bal = v("su-balance"), asof = v("su-asof"), balance = bal !== "" && !isNaN(parseFloat(bal)) ? parseFloat(bal) : null, asOf = balance != null && isDate(asof) ? asof : null;
  var L = S.ledger || {}, ledger;

  else ledger = { balance: balance, asOf: asOf, accrualPerMonth: 2.5, note: balance != null && asOf ? "From your LES dated " + mil(parseD(asOf)) + "." : null };
  return { profile: profile, settings: settings, ledger: ledger };
}
function seedDocs(profile, planSet){
  var sd = seedFor(flagsFor(profile)), docs = [];
  sd.loes.forEach(function(l){ docs.push(["loes/" + l.id, l]); });
  sd.items.forEach(function(i){ var x = clone(i); delete x.when; if (x.due && x.due.date === "SETUP") x.due = { date: planSet }; docs.push(["items/" + x.id, x]); });
  sd.contacts.forEach(function(c){ var x = clone(c); delete x.when; docs.push(["contacts/" + x.id, x]); });
  Object.keys(sd.claim || {}).forEach(function(k){ docs.push(["claim/" + k, sd.claim[k]]); });
  return { docs: docs, seed: sd };
}
function applySetup(mode){
  if (DB && !editGuard()) return;
  var r = readSetup(mode); if (!r) return;
  if (!DB) {
    var sd = seedDocs(r.profile, r.settings.planSet).seed;
    S.profile = r.profile; S.settings = r.settings; S.ledger = r.ledger; S.items = {}; sd.items.forEach(function(i){ var x = clone(i); if (x.due && x.due.date === "SETUP") x.due = { date: r.settings.planSet }; S.items[x.id] = x; }); S.loes = sd.loes; S.contacts = sd.contacts; S.claim = sd.claim || {};
    UI.setup = null; el("banner").innerHTML = ""; try { localStorage.setItem("mo.plan", JSON.stringify({ profile: S.profile, settings: S.settings, ledger: S.ledger, items: S.items, loes: S.loes, contacts: S.contacts, claim: S.claim })); } catch(e) {}
    render(); toast("Set up in this browser only. Publish the board to keep it."); return;
  }
  if (mode === "new" && !loadedAll()) { toast("The board is still loading. Try again in a moment."); return; }
  if (mode === "new" && !S.seeded && typeof DB.doc("meta/seeding").acquire !== "function") { setupStop(LOCK_LINE); return; }
  var docs = [["meta/profile", r.profile], ["meta/settings", r.settings], ["meta/ledger", r.ledger]], prog = el("su-prog"), gen = GEN;
  UI.setupBusy = true; if (prog) prog.textContent = "Checking...";
  docs.reduce(function(pr, d){ return pr.then(function(){ if (S.reset || gen !== GEN) throw { code: "reset" }; return DB.doc(d[0]).set(d[1]); }); }, Promise.resolve())
    .then(function(){ S.profile = r.profile; S.settings = r.settings; S.ledger = r.ledger;
      if (mode === "new" && !S.seeded) return runSeed(r.profile, r.settings, r.settings.planSet, function(n, total){ if (prog) prog.textContent = "Setting up " + n + " of " + total; });
      return ackPlan(r.profile, r.settings).then(function(){ return null; }); })
    .then(function(total){ UI.setupBusy = false; UI.setup = null; if (total) S.dbEmpty = false; el("banner").innerHTML = ""; toast(total ? "Board ready. " + total + " records written." : "Profile saved."); render(); })
    .catch(function(e){ UI.setupBusy = false; if (e && (e.code === "mixed" || e.code === "nolock")) UI.seedHalt = true; var t = e && e.code === "reset" ? RESET_TOAST : seedFailText(e); if (prog) prog.textContent = t; toast(t); render(); });
}

try { if (!(window.claude && window.claude.use)) { var lp = JSON.parse(localStorage.getItem("mo.plan") || "null"); if (lp && lp.settings) { S.profile = lp.profile || {}; S.settings = lp.settings; S.ledger = lp.ledger || S.ledger; S.items = lp.items || S.items; S.loes = lp.loes || S.loes; S.contacts = lp.contacts || S.contacts; S.claim = lp.claim || S.claim; S.blocks = lp.blocks || S.blocks; S.conditions = lp.conditions || S.conditions; } } } catch(e) {}
